name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Unit & Integration Tests (RLS Isolation, WCAG Contrast, Primitives)
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
          ALLOW_DEV_MOCK_OTP: "false"
